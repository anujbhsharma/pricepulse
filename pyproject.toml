[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pricepulse"
version = "0.1.0"
description = "Gadget price tracker for Canadian retailers: price history, all-time-low detection, drop alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anujbhsharma" }]
keywords = ["price", "tracker", "canada", "deals", "all-time-low"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pricepulse = "pricepulse.cli:main"

[tool.setuptools.packages.find]
include = ["pricepulse*"]

[tool.setuptools.package-data]
pricepulse = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
